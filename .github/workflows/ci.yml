name: Build Merge Deploy VPS

on:
  push:
    branches: [main, 'dev**', 'feat**']
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a running deployment. GitHub may replace older pending runs.
concurrency:
  group: vps-production
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare exact merge candidate
        id: candidate
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH"
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" fetch origin main "$SOURCE_BRANCH"
          BASE_SHA=$(git rev-parse origin/main)
          LATEST_SOURCE=$(git rev-parse "origin/$SOURCE_BRANCH")
          if [ "$SOURCE_SHA" != "$LATEST_SOURCE" ]; then
            echo 'Branch advanced; skip this stale run.'
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --detach "$BASE_SHA"
          if [ "$SOURCE_BRANCH" != main ]; then
            git merge --no-ff "$SOURCE_SHA" -m "Merge $SOURCE_BRANCH into main [automated]"
          fi
          echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo 'skip=false' >> "$GITHUB_OUTPUT"

      - name: Build backend Docker image
        if: steps.candidate.outputs.skip == 'false'
        env:
          RELEASE_SHA: ${{ steps.candidate.outputs.sha }}
        run: docker build -t "desimarket-backend:$RELEASE_SHA" backend

      - name: Build frontend Docker image
        if: steps.candidate.outputs.skip == 'false'
        env:
          RELEASE_SHA: ${{ steps.candidate.outputs.sha }}
          API_URL: ${{ vars.NEXT_PUBLIC_BACKEND_API_URL }}
          STRIPE_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          GOOGLE_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          DEPLOYED_API_URL: ${{ vars.NEXT_PUBLIC_DEPLOYED_BACKEND_API_URL }}
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --build-arg NEXT_PUBLIC_BACKEND_API_URL="$API_URL" \
            --build-arg NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY="$STRIPE_KEY" \
            --build-arg NEXT_PUBLIC_GOOGLE_CLIENT_ID="$GOOGLE_ID" \
            --build-arg NEXT_PUBLIC_DEPLOYED_BACKEND_API_URL="$DEPLOYED_API_URL" \
            -t "desimarket-frontend:$RELEASE_SHA" frontend

      - name: Package the exact tested images
        if: steps.candidate.outputs.skip == 'false'
        env:
          RELEASE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          docker save "desimarket-backend:$RELEASE_SHA" "desimarket-frontend:$RELEASE_SHA" | gzip > images.tar.gz

      - name: Configure SSH
        if: steps.candidate.outputs.skip == 'false'
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Check whether automatic deployment is paused
        id: gate
        if: steps.candidate.outputs.skip == 'false'
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          STATUS=$(ssh -p "$PORT" -o BatchMode=yes "$USER@$HOST" \
            'if [ -f /opt/desimarket/deployment-paused ]; then echo paused; else echo enabled; fi')
          if [ "$STATUS" = paused ]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Build passed. Automatic merge/deployment skipped because an older release is pinned.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$STATUS" = enabled ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Unexpected deployment status'; exit 1
          fi

      - name: Upload before merging (running app stays unchanged)
        if: steps.candidate.outputs.skip == 'false' && steps.gate.outputs.enabled == 'true'
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT }}
          RELEASE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          ssh -p "$PORT" -o BatchMode=yes "$USER@$HOST" "mkdir -p /opt/desimarket/incoming/$RELEASE_SHA"
          scp -P "$PORT" -o BatchMode=yes images.tar.gz "$USER@$HOST:/opt/desimarket/incoming/$RELEASE_SHA/images.tar.gz"

      - name: Upload deployment files
        if: steps.candidate.outputs.skip == 'false' && steps.gate.outputs.enabled == 'true'
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          test -f deploy/deploy.sh
          test -f deploy/compose.prod.yml

          scp -P "$PORT" -o BatchMode=yes \
            deploy/deploy.sh \
            deploy/compose.prod.yml \
            "$USER@$HOST:/opt/desimarket/"

      - name: Publish the tested candidate to main
        if: steps.candidate.outputs.skip == 'false' && steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          BASE_SHA: ${{ steps.candidate.outputs.base }}
        run: |
          set -euo pipefail
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH"
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" fetch origin main "$SOURCE_BRANCH"
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || { echo 'Main changed; rerun against latest main.'; exit 1; }
          test "$(git rev-parse "origin/$SOURCE_BRANCH")" = "$SOURCE_SHA" || { echo 'Source changed; newer run must build it.'; exit 1; }
          if [ "$SOURCE_BRANCH" != main ]; then
            # Non-force push; a concurrent non-fast-forward update is rejected.
            git -c "http.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:main
          fi

      - name: Deploy and automatically restore previous healthy release on failure
        if: steps.candidate.outputs.skip == 'false' && steps.gate.outputs.enabled == 'true'
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT }}
          RELEASE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          ssh -p "$PORT" -o BatchMode=yes "$USER@$HOST" \
            "bash /opt/desimarket/deploy.sh $RELEASE_SHA"

      - name: Remove SSH credentials
        if: always()
        run: rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
